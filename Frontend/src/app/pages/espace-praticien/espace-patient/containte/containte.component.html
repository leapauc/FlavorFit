<div class="unactiv-form position-relative p-3 rounded">
  <!-- Bouton crayon en haut à droite -->
  <button
    class="position-absolute p-0"
    style="
      top: 10px;
      right: 10px;
      z-index: 10;
      border: none;
      background: transparent;
    "
    (click)="toggleEdit()"
  >
    <i
      class="fs-1"
      [class.text-primary]="!isEditMode"
      [class.text-danger]="isEditMode"
      [ngClass]="isEditMode ? 'null' : 'bi bi-pencil-square'"
    ></i>
  </button>

  <br />
  <h4 class="text-center">Contrainte</h4>

  <div class="unactiv-form">
    <div class="row">
      <div class="col-6 mb-3">
        <label class="form-label">Pathologie(s)</label>

        <!-- Faux select -->
        <div
          class="form-control d-flex flex-wrap gap-2"
          [class.disabled]="!isEditMode"
          (click)="isEditMode && toggleDropdown()"
        >
          <span *ngIf="!selectedPathologies.length" class="text-muted">
            Sélectionner des pathologies
          </span>

          <!-- Chips -->
          <div
            *ngFor="let pathology of selectedPathologies"
            class="badge bg-danger d-flex align-items-center gap-1"
            (click)="$event.stopPropagation()"
          >
            {{ pathology }}
            <i
              class="bi bi-x ms-1"
              role="button"
              (click)="removePathology(pathology)"
            ></i>
          </div>
        </div>
        <!-- Dropdown -->
        <div
          *ngIf="dropdownOpen && isEditMode"
          class="dropdown-menu show w-100 p-2"
        >
          <div *ngFor="let group of pathologyGroups">
            <strong class="d-block mb-1">{{ group.type }}</strong>

            <div *ngFor="let item of group.items" class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                [checked]="selectedPathologies.includes(item)"
                (change)="togglePathology(item)"
                id="{{ item }}"
              />
              <label class="form-check-label" for="{{ item }}">
                {{ item }}
              </label>
            </div>

            <hr />
          </div>
        </div>
      </div>
      <div class="col-5 mb-3 offset-1">
        <label for="antecedents" class="form-label">Antécédents :</label>
        <textarea
          id="antecedents"
          name="antecedents"
          class="form-control"
          [(ngModel)]="formData.antecedents"
          [readonly]="!isEditMode"
          rows="3"
        ></textarea>
      </div>
    </div>

    <div class="row">
      <div class="col-6 mb-3">
        <label class="form-label">Allergies</label>

        <!-- Mode lecture -->
        <div *ngIf="!isEditMode" class="form-control bg-light w-100">
          {{
            selectedAllergies.length
              ? selectedAllergies.join(", ")
              : "Aucune allergie"
          }}
        </div>

        <!-- Mode édition -->
        <div *ngIf="isEditMode" class="w-100 position-relative">
          <!-- Chips -->
          <div class="d-flex flex-wrap gap-2 mb-2 w-100">
            <span
              *ngFor="let allergy of selectedAllergies"
              class="badge bg-warning text-dark"
            >
              {{ allergy }}
              <i
                class="bi bi-x ms-1"
                role="button"
                (click)="removeAllergy(allergy)"
              ></i>
            </span>
          </div>

          <!-- Input -->
          <input
            type="text"
            class="form-control w-100 mb-2"
            placeholder="Ajouter une allergie..."
            [(ngModel)]="ingredientSearch"
            name="ingredientSearch"
            (input)="filterIngredientAutocomplete()"
          />

          <!-- Suggestions -->
          <ul
            *ngIf="filteredIngredients.length"
            class="list-group position-absolute w-100"
            style="
              top: 100%;
              left: 0;
              z-index: 1000;
              max-height: 250px;
              overflow-y: auto;
            "
          >
            <li
              *ngFor="let ingredient of filteredIngredients"
              class="list-group-item list-group-item-action"
              (click)="toggleAllergy(ingredient)"
            >
              {{ ingredient }}
            </li>
          </ul>
        </div>
      </div>

      <!-- Restrictions alimentaires -->
      <div class="col-5 offset-1 mb-3 position-relative">
        <label class="form-label">Restrictions alimentaires</label>

        <!-- Faux select -->
        <div
          class="form-control d-flex flex-wrap gap-2"
          (click)="toggleRestrictionsDropdown()"
        >
          <span *ngIf="!selectedRestrictions.length" class="text-muted">
            Sélectionner des restrictions
          </span>

          <!-- Chips -->
          <div
            *ngFor="let option of selectedRestrictions"
            class="badge bg-secondary d-flex align-items-center gap-1"
            (click)="$event.stopPropagation()"
          >
            {{ option }}
            <i
              class="bi bi-x ms-1"
              role="button"
              (click)="removeRestrictionsOption(option)"
            ></i>
          </div>
        </div>

        <!-- Dropdown -->
        <div
          *ngIf="restrictionsDropdownOpen"
          class="dropdown-menu show w-100 p-2"
          (click)="$event.stopPropagation()"
        >
          <div *ngFor="let option of Restrictions" class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              [id]="sanitizeId(option)"
              [checked]="selectedRestrictions.includes(option)"
              (change)="toggleRestrictionsOption(option)"
            />
            <label class="form-check-label" [for]="sanitizeId(option)">
              {{ option }}
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-6 mb-3">
        <label for="conviction" class="form-label">Conviction</label>

        <!-- Mode lecture -->
        <div *ngIf="!isEditMode" class="form-control bg-light">
          {{ formData.conviction || "Aucune conviction alimentaire" }}
        </div>

        <!-- Mode édition -->
        <select
          *ngIf="isEditMode"
          class="form-control"
          [(ngModel)]="formData.conviction"
        >
          <option value="">Aucune conviction alimentaire</option>
          <option
            *ngFor="let conviction of convictionGroups"
            [value]="conviction"
          >
            {{ conviction }}
          </option>
        </select>
      </div>
      <div class="col-5 mb-3 offset-1">
        <label for="autres_info" class="form-label"
          >Autres informations :</label
        >
        <textarea
          id="autres_info"
          name="autres_info"
          class="form-control"
          [(ngModel)]="formData.autres_info"
          [readonly]="!isEditMode"
          rows="3"
        ></textarea>
      </div>
    </div>

    <!-- Boutons bas page visibles seulement en mode édition -->
    <div *ngIf="isEditMode" class="mt-3 d-flex justify-content-end gap-2">
      <div class="d-flex gap-3 justify-content-end mt-3">
        <!-- Annuler -->
        <button
          class="danger square-btn d-flex justify-content-center align-items-center"
          (click)="cancelEdit()"
        >
          <i class="bi bi-x-circle fs-4"></i>
        </button>

        <!-- Réinitialiser -->
        <button
          class="reinit square-btn d-flex justify-content-center align-items-center"
          (click)="resetForm()"
        >
          <i class="bi bi-arrow-counterclockwise fs-4"></i>
        </button>

        <!-- Valider -->
        <button
          class="success square-btn d-flex justify-content-center align-items-center"
          (click)="saveEdit()"
        >
          <i class="bi bi-check-circle fs-4"></i>
        </button>
      </div>
    </div>
  </div>
</div>
